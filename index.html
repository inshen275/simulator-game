<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>保研模拟器</title>
<style>
*{box-sizing:border-box}
:root{
  --ink:#22223b;--paper:#f2e8cf;--paper2:#e6d7b0;--bg:#1d1b33;
  --red:#e94560;--green:#43aa8b;--yellow:#f9c74f;--blue:#4d96ff;--purple:#9b5de5;--orange:#f8961e;--teal:#2ec4b6;--pink:#ff70a6;
}
html,body{margin:0;min-height:100vh}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Zpix","Fusion Pixel","SimSun","宋体","NSimSun","Courier New",monospace;
  font-size:16px;line-height:1.7;-webkit-font-smoothing:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px);
  background-size:24px 24px;
}
body::after{content:"";pointer-events:none;position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 4px);z-index:99}
button,input{font:inherit;color:inherit}
canvas{image-rendering:pixelated}

/* 像素描边：缺角边框 */
.px{box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),
  inset -4px -4px 0 0 rgba(0,0,0,.12),inset 4px 4px 0 0 rgba(255,255,255,.35)}
.panel{background:var(--paper);padding:16px 18px}

#app{max-width:1120px;margin:0 auto;padding:20px 16px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:var(--red);color:#fff;padding:10px 16px;margin-bottom:22px}
.logo{font-size:20px;letter-spacing:2px;text-shadow:2px 2px 0 var(--ink)}
.top-btns{display:flex;gap:12px}
.layout{display:grid;grid-template-columns:290px 1fr;gap:22px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}

.btn{display:block;width:100%;text-align:left;border:0;cursor:pointer;padding:10px 14px;margin:12px 0;
  background:var(--yellow);transition:transform .05s}
.btn:hover{transform:translate(-2px,-2px);background:#ffd96b}
.btn:active{transform:translate(2px,2px)}
.btn.small{display:inline-block;width:auto;margin:0;padding:4px 12px;font-size:14px;background:var(--paper);color:var(--ink)}
.btn.center{text-align:center}
.btn.locked,.btn:disabled{background:#bbb;color:#666;cursor:not-allowed;transform:none}
.btn .hint{float:right;font-size:13px;opacity:.75}
.btn .key{display:inline-block;background:var(--ink);color:var(--yellow);padding:0 6px;margin-right:8px}

/* 侧栏 */
.avatar-box{display:flex;gap:14px;align-items:center;margin-bottom:10px}
#avatar{background:var(--paper2);width:96px;height:96px}
.who b{font-size:18px}
.who div{font-size:13px}
.stat{margin:6px 0}
.row{display:flex;justify-content:space-between;font-size:14px}
.bar{display:flex;gap:2px;margin-top:2px}
.seg{flex:1;height:10px;background:rgba(0,0,0,.12)}
.divider{height:4px;background:var(--ink);margin:10px 0;opacity:.8}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;padding:0 6px;background:var(--ink);color:var(--paper)}
.tag.g{background:var(--green);color:#fff}.tag.r{background:var(--red);color:#fff}.tag.y{background:var(--yellow);color:var(--ink)}
.warn{color:var(--red);font-size:13px;animation:blink 1s steps(2) infinite}
.rankbox{background:var(--ink);color:var(--paper);padding:8px 10px;margin:8px 0}
.rankbox .big{font-size:22px;color:var(--yellow)}
.up{color:var(--green)}.down{color:var(--red)}
.rankbox .up{color:#7ee2b8}.rankbox .down{color:#ff8fa3}
#rankChart{width:100%;height:48px;background:rgba(255,255,255,.08);margin-top:4px}
.money{font-size:18px}

/* 主面板 */
.stage-label{display:inline-block;background:var(--ink);color:var(--yellow);padding:0 8px;font-size:13px}
.progress{display:flex;gap:3px;margin:8px 0 14px}
.progress i{flex:1;height:8px;background:rgba(0,0,0,.15)}
.progress i.on{background:var(--red)}
h2{margin:6px 0 10px;font-size:22px}
.story{white-space:pre-wrap;min-height:80px;cursor:pointer}
.cursor::after{content:"▌";animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.choices{animation:fadein .25s steps(4)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.delta{padding:1px 8px;font-size:14px;color:#fff}
.delta.up{background:var(--green);color:#fff}.delta.down{background:var(--red);color:#fff}
.chosen{font-size:14px;opacity:.75;margin-bottom:6px}
.shake{animation:shake .3s steps(3)}
@keyframes shake{25%{transform:translate(-6px,0)}50%{transform:translate(6px,0)}75%{transform:translate(-3px,0)}}

/* 月度计划 */
.plan-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--ink);color:var(--paper);padding:8px 12px;margin-bottom:14px}
.plan-head b{color:var(--yellow)}
.ap i{display:inline-block;width:14px;height:14px;margin-right:3px;background:var(--yellow)}
.ap i.off{background:#555}
.tabs{display:flex;gap:12px;margin-bottom:12px}
.tab{border:0;cursor:pointer;padding:4px 16px;background:var(--paper2)}
.tab.on{background:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.act{border:0;cursor:pointer;text-align:left;background:var(--paper2);padding:8px 10px}
.act:hover:not(:disabled){background:var(--yellow);transform:translate(-2px,-2px)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act b{font-size:15px}
.act .cost{float:right;font-size:12px;background:var(--ink);color:var(--yellow);padding:0 5px}
.act p{margin:2px 0 0;font-size:12px}
.feed{margin-top:14px;font-size:13px;background:rgba(0,0,0,.06);padding:8px 10px;max-height:160px;overflow:auto}
.feed div{border-bottom:2px dashed rgba(0,0,0,.1);padding:2px 0}
.feed .deltas{margin:2px 0}
.feed .delta{font-size:12px}

.npc{background:var(--paper2);padding:10px}
.npc-top{display:flex;gap:10px;align-items:center}
.npc-face{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex:none}
.npc p{margin:4px 0;font-size:12px}
.npc .perk{font-size:12px;padding:0 4px;background:rgba(0,0,0,.08);margin:2px 0}
.npc .perk.done{background:var(--green);color:#fff}
.npc-btns{display:flex;gap:10px;margin-top:8px}
.npc-btns button{flex:1;border:0;cursor:pointer;background:var(--yellow);padding:2px 4px;font-size:13px}
.npc-btns button:disabled{background:#bbb;cursor:not-allowed}
.agency{background:var(--paper2);padding:12px;margin-bottom:14px}
.agency .price{color:var(--red);font-size:20px}

/* 标题页 */
.title-screen{text-align:center;padding:30px 10px}
.big-title{font-size:56px;color:var(--red);letter-spacing:6px;margin:10px 0;
  text-shadow:4px 4px 0 var(--yellow),8px 8px 0 var(--ink)}
.sub-title{color:var(--ink);letter-spacing:3px}
.press{margin-top:20px;animation:blink 1.2s steps(2) infinite}
.menu{max-width:320px;margin:24px auto 0}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:14px}
.role{cursor:pointer;background:var(--paper2);padding:12px;border:0;text-align:left}
.role:hover{background:var(--yellow);transform:translate(-2px,-2px)}
.role b{font-size:17px}
.role p{margin:4px 0 0;font-size:13px}
.name-input{background:#fff;border:0;padding:6px 10px;width:180px;margin-left:8px}

/* 日志 */
#logbox{margin-top:22px;max-height:220px;overflow:auto;font-size:13px}
#logbox h3{margin:0 0 6px;font-size:15px}
.log-item{border-bottom:2px dashed rgba(0,0,0,.15);padding:3px 0}
.log-item span{color:var(--red)}

/* 结局 */
.ending{text-align:center}
.rarity{display:inline-block;padding:2px 14px;color:#fff;font-size:18px;margin:6px 0}
.ending h2{font-size:32px;margin:10px 0;text-shadow:3px 3px 0 var(--yellow)}
.ending .desc{text-align:left;white-space:pre-wrap;background:var(--paper2);padding:12px;margin:14px 0}
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0;font-size:14px}
.summary div{background:var(--ink);color:var(--paper);padding:4px}

/* 弹窗 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
#modal .panel{max-width:680px;width:100%;max-height:85vh;overflow:auto}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:12px 0}
.g-item{background:var(--paper2);padding:8px;font-size:13px}
.g-item b{font-size:15px}
.g-item.lock{opacity:.5}
</style>
</head>
<body>
<div id="app">
  <header class="topbar px">
    <div class="logo">★ 保研模拟器 ★</div>
    <div class="top-btns">
      <button class="btn small px" id="btnGallery">结局图鉴</button>
      <button class="btn small px" id="btnMenu">菜单</button>
    </div>
  </header>
  <div class="layout">
    <aside id="side" class="panel px"></aside>
    <main id="main" class="panel px"></main>
  </div>
  <section id="logbox" class="panel px"></section>
</div>
<div id="modal" hidden><div class="panel px" id="modalBody"></div></div>

<script>
/* ============ 基础 ============ */
const KEY = 'baoyan-sim-save-v2';
const GKEY = 'baoyan-sim-endings-v2';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const roll = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sig = x => 1 / (1 + Math.exp(-x));
const $ = id => document.getElementById(id);
const val = (x, s) => typeof x === 'function' ? x(s) : x;

const N = 120, QUOTA = 36;   // 专业人数 / 推免名额
const ALLOWANCE = 600;       // 每月生活费结余

const ATTRS = {
  gpa:    { n: 'GPA',  min: 1.5, max: 4.0, c: 'var(--blue)' },
  kn:     { n: '基础', min: 0, max: 100, c: 'var(--teal)' },
  eng:    { n: '英语', min: 0, max: 100, c: 'var(--yellow)' },
  sci:    { n: '科研', min: 0, max: 100, c: 'var(--purple)' },
  comp:   { n: '竞赛', min: 0, max: 100, c: 'var(--orange)' },
  intern: { n: '实习', min: 0, max: 100, c: 'var(--pink)' },
  mood:   { n: '心态', min: 0, max: 100, c: 'var(--green)' },
};
const LABEL = { rank: '排名', gpa: 'GPA', kn: '基础', eng: '英语', sci: '科研', comp: '竞赛', intern: '实习', mood: '心态', coins: '金币', bonus: '加分', zhenti: '真题' };

const ROLES = [
  { id: 'xueba', n: '卷王学霸', d: '绩点就是生命线，图书馆座位是你的第二张床。', a: { gpa: 3.72, kn: 45, eng: 60, sci: 8, comp: 8, intern: 0, mood: 55 }, coins: 1500, bonus: 0 },
  { id: 'jingsai', n: '竞赛狂魔', d: '代码和建模才是浪漫。大二已有一个省奖。', a: { gpa: 3.4, kn: 30, eng: 45, sci: 12, comp: 40, intern: 0, mood: 70 }, coins: 1500, bonus: 1.5 },
  { id: 'keyan', n: '科研萌新', d: '大二就进了组，虽然主要负责拿外卖。', a: { gpa: 3.5, kn: 35, eng: 50, sci: 30, comp: 5, intern: 0, mood: 65 }, coins: 1500, bonus: 0 },
  { id: 'foxi', n: '佛系青年', d: '保研？随缘。心态全场最佳，家里给的生活费也多一点。', a: { gpa: 3.3, kn: 25, eng: 50, sci: 5, comp: 5, intern: 5, mood: 95 }, coins: 3000, bonus: 0 },
  { id: 'random', n: '随机人生', d: '命运的骰子替你决定一切。', a: null },
];

const NPCS = [
  { id: 'wang', n: '王卷卷', type: '同学', color: 'var(--blue)', aff: 10, d: '同专业绩点第一，图书馆座位永远在你斜对面。',
    perks: [[40, '好感≥40：成为学习搭子（自习收益提升）']] },
  { id: 'li', n: '李八卦', type: '同学', color: 'var(--orange)', aff: 15, d: '全年级的消息都会经过这里，也很爱打听别人的消息。',
    perks: [[20, '好感≥20：可以反向打听情报'], [40, '好感≥40：透露预推免内部消息']] },
  { id: 'zhang', n: '张佛', type: '室友', color: 'var(--green)', aff: 20, d: '你的室友，信奉"一切随缘"，心态稳如老狗。',
    perks: [[40, '好感≥40：学会松弛感（休息收益提升）']] },
  { id: 'chen', n: '陈学姐', type: '学姐', color: 'var(--purple)', aff: 15, d: '你的直系学姐，去年保研去了华五，在本院实验室带大创。',
    perks: [[25, '好感≥25：10月邀请你做【大创】'], [30, '好感≥30：赠送保研真题×1']], proj: 1 },
  { id: 'liu', n: '刘学长', type: '学长', color: 'var(--red)', aff: 5, d: '挑战杯国奖得主，竞赛圈的传说。',
    perks: [[25, '好感≥25：3月邀请你冲【挑战杯】'], [30, '好感≥30：赠送机试真题×1']], proj: 6 },
  { id: 'zhou', n: '周学姐', type: '学姐', color: 'var(--pink)', aff: 5, d: '创业达人，正在组【互联网+】团队。',
    perks: [[25, '好感≥25：5月邀请你加入【互联网+】'], [30, '好感≥30：赠送面试真题×1']], proj: 8 },
];
const npc = id => NPCS.find(n => n.id === id);
const SENIORS = ['chen', 'liu', 'zhou'];

const TIER = ['', '清北', '华五/顶尖985', '中流985', '211/本校'];
const TH = [0, 75, 62, 50, 38];
const COST = [0, 1600, 1300, 900, 200];   // 机票 + 酒店

const STAGES = [
  { name: '大三上', sub: '第一阶段 · 开局', desc: '九月，梧桐叶还没黄。保研倒计时一年。\n专业 120 人，推免名额 36 个——你的排名，从今天开始每个月都在变化。' },
  { name: '大三下', sub: '第二阶段 · 积累', desc: '寒假过后，身边的人开始悄悄"上分"。\n论文、竞赛、绩点、实习、钱包……时间只有这么多，你必须做出取舍。' },
  { name: '暑期夏令营', sub: '第三阶段 · 夏令营', desc: '各校夏令营轮番开放。\n机票、酒店都要自掏腰包——钱包和前途，你得一起算。' },
  { name: '大四上', sub: '第四阶段 · 预推免', desc: '推免资格即将公示，预推免进入白热化。\n名额、候补、鸽子……保研江湖，险恶得很。' },
  { name: '九推', sub: '最终阶段 · 九推', desc: '9 月 28 日，推免服务系统开放。\n一年的努力，将在今晚尘埃落定。' },
];

const MONTHS = [
  { n: '大三上 · 9月', st: 0, ap: 3, ev: ['opening'] },
  { n: '大三上 · 10月', st: 0, ap: 3, ev: ['proj_chen'] },
  { n: '大三上 · 11月', st: 0, ap: 3, ev: ['ask_li'] },
  { n: '大三上 · 12月', st: 0, ap: 3, ev: ['cet6', 'ask_wang'] },
  { n: '大三上 · 1月', st: 0, ap: 2, ev: ['final1'] },
  { n: '寒假 · 2月', st: 1, ap: 4, ev: ['winter'] },
  { n: '大三下 · 3月', st: 1, ap: 3, ev: ['proj_liu'] },
  { n: '大三下 · 4月', st: 1, ap: 3, ev: ['paper', 'ask_li2'] },
  { n: '大三下 · 5月', st: 1, ap: 3, ev: ['proj_zhou', 'cv', 'ask_wang2'] },
  { n: '大三下 · 6月', st: 1, ap: 2, ev: ['final2', 'camp_apply'] },
  { n: '暑假 · 7月', st: 2, ap: 2, ev: ['camp_travel', 'camp_interview'] },
  { n: '暑假 · 8月', st: 2, ap: 2, ev: ['after_camp'] },
  { n: '大四上 · 9月上旬', st: 3, ap: 1, ev: ['qual', 'prepush_mode', 'prepush'] },
  { n: '大四上 · 9月中旬', st: 3, ap: 1, ev: ['drama'] },
  { n: '九推 · 9月28日', st: 4, ap: 0, ev: ['ninepush'] },
];

/* ============ 数值 ============ */
function A(s, d) {
  for (const k in d) {
    const m = ATTRS[k];
    const v = clamp(s.a[k] + d[k], m.min, m.max);
    s.a[k] = k === 'gpa' ? Math.round(v * 100) / 100 : Math.round(v);
  }
}
// 边际递减的成长
function grow(s, k, base) { A(s, { [k]: Math.max(1, Math.round(base * (1 - s.a[k] / 130))) }); }
function aff(s, id, d) { s.aff[id] = clamp(s.aff[id] + d, 0, 100); }

// 推免排名分 = GPA 折算 + 竞赛/科研加分；同学们也在进步，平均线逐月上移
function tui(s) { return s.a.gpa * 22.5 + s.bonus; }
function classMean(s) { return 78 + s.m * .15 + (s.f.rival || 0) * .4; }
function Phi(z) { return sig(1.702 * z); }
function rank(s) { return clamp(Math.round((1 - Phi((tui(s) - classMean(s)) / 5)) * N) + 1, 1, N); }
function lineGpa(s) { const p = 1 - (QUOTA - 1) / N; return (classMean(s) + Math.log(p / (1 - p)) / 1.702 * 5) / 22.5; }
function qualified(s) { return rank(s) <= QUOTA; }

function score(s) {
  const a = s.a, f = s.f;
  let x = (a.gpa - 2.8) / 1.2 * 40 + a.eng * .15 + a.sci * .25 + a.comp * .2 + s.bonus * 1.5;
  if (f.paper) x += 6;
  if (f.cv) x += 3;
  if (f.cet6) x += 2;
  return Math.max(0, Math.round(x));
}
function ivBonus(s) { return Math.min(s.zhenti, 3) * 3 + (s.f.agency === 2 ? 5 : 0); }
function chance(s, t, b = 0) {
  let p = sig((score(s) + ivBonus(s) + b - TH[t]) / 5);
  if (s.a.mood < 30) p *= .8;
  return clamp(p, .03, .97);
}
function hint(p) { return p > .7 ? '把握较大' : p > .4 ? '有希望' : p > .15 ? '很悬' : '做梦'; }
function tierHint(sc) { return sc >= TH[1] ? '清北有戏' : sc >= TH[2] ? '华五可冲' : sc >= TH[3] ? '985稳中求进' : sc >= TH[4] ? '保底无忧' : '危险边缘'; }
function best(s) { return s.offers.length ? Math.min(...s.offers) : 0; }
function gain(s, t) { if (!s.offers.includes(t)) s.offers.push(t); }
function campCost(s, t) { return s.f.reimb && s.f.reimb.includes(t) ? Math.round(COST[t] * .3) : COST[t]; }
function maxSenior(s) { return Math.max(...SENIORS.map(id => s.aff[id])); }

// 考研 / 出国 / 求职
function kyP(s, th, b = 0) { let p = sig((s.a.kn + b - th) / 6); if (s.a.mood < 30) p *= .8; return clamp(p, .03, .95); }
function abroadScore(s, b = 0) { return (s.a.gpa - 3) * 40 + (s.a.eng - 50) * .8 + s.a.sci * .2 + s.a.intern * .1 + (s.f.paper ? 5 : 0) + b; }

function snap(s) { return { rank: rank(s), ...s.a, coins: s.coins, bonus: s.bonus, zhenti: s.zhenti }; }
function diffs(b, s) {
  const a = snap(s), out = [];
  for (const k in a) {
    const d = a[k] - b[k];
    if (Math.abs(d) < .001) continue;
    if (k === 'rank') out.push({ t: `排名 ${d < 0 ? '▲' : '▼'}${Math.abs(d)}`, up: d < 0 });
    else out.push({ t: `${LABEL[k]} ${d > 0 ? '+' : ''}${k === 'gpa' ? d.toFixed(2) : k === 'bonus' ? d.toFixed(1) : d}`, up: d > 0 });
  }
  return out;
}
const dtxt = ds => ds.map(d => d.t).join(' ');

/* ============ 剧情事件 ============ */
const EV = {
  /* ---- 大三上 ---- */
  opening: { title: '开学第一周',

  /* ---- 夏令营 ---- */
  camp_travel: { title: '参营行程', cond: s => s.f.inCamp && s.f.inCamp.length,
    text: s => `你入营了：\n${s.f.inCamp.map(t => `  ${TIER[t]}：机票+酒店 ¥${campCost(s, t)}${s.f.reimb.includes(t) ? '（包食宿）' : ''}`).join('\n')}\n\n你的钱包：¥${s.coins}。去哪几个？`,
    choices: s => {
      const list = s.f.inCamp, total = list.reduce((x, t) => x + campCost(s, t), 0);
      const go = ts => s => { const c = ts.reduce((x, t) => x + campCost(s, t), 0); s.coins -= c; s.f.attend = ts;

      const out = [];
      if (list.length > 1) out.push({ t: `全都去（¥${total}）`, req: s => s.coins >= total, rq: `需要 ¥${total}`, fx: go(list) });
      list.forEach(t => out.push({ t: `只去 ${TIER[t]}（¥${campCost(s, t)}）`, req: s => s.coins >= campCost(s, t), rq: `需要 ¥${campCost(s, t)}`, fx: go([t]) }));
      out.push({ t: '钱不够，全部放弃', d: { mood: -8 }, fx: go([]) });
      return out;

  camp_interview: { title: '夏令营考核',
    text: s => s.f.attend && s.f.attend.length

      : '朋友圈里都是"优营 get"，而你这个夏天没有参营。\n怎么办？',
    choices: s => {
      if (!s.f.attend || !s.f.attend.length) return [

      return [
        { t: '把真题刷透', h: `真题×${s.zhenti}`, fx: iv(s.zhenti * 2) },
        { t: '英文自我介绍背到滚瓜烂熟', fx: iv(Math.round(s.a.eng / 12)) },
        { t: '把科研经历讲透', fx: iv(Math.round(s.a.sci / 10)) },
        { t: '随缘面试，保持松弛', fx: s => { A(s, { mood: 6 }); return iv(0)(s); } },
      ];

function kyGo(th, b, res, school) {
  return s => {
    s.f.trackDone = 1;
    if (roll(kyP(s, th, b))) { s.f.res = res; s.f.school = school; return `十二月，你走进考场。\n三月，成绩出来了——上线！你考上了${school}！`; }
    s.f.res = 'fail'; return '十二月，你走进考场。\n三月，成绩出来了……差了几分。';
  };
}
function abroadHint(s, b) { const x = abroadScore(s, b); return x >= 48 ?'QS前100有戏' : x >= 15 ? '能申到学校' : '很悬'; }
function abroadGo(s, b) {
  s.f.trackDone = 1;
  const x = abroadScore(s, b);
  if (roll(sig((x - 48) / 6))) { s.f.res = 'top'; return '邮箱里躺着一封 Offer —— QS 前 100 的名校！'; }
  if (roll(sig((x - 15) / 6))) { s.f.res = 'mid'; return '你收到了一所 QS 100 名开外学校的录取。'; }
  s.f.res = 'fail'; return '申请季结束，你收到了 8 封拒信。';
}
function jobBigP(s) { return clamp(sig((s.a.intern + s.a.comp * .2 - 55) / 7), .03, .95); }
function jobSoeP(s) { return clamp(sig((s.a.intern * .6 + (s.a.gpa - 3) * 40 + s.a.kn * .2 - 35) / 7), .05, .95); }

function calcEnding(s) {
  if (s.f.collapse) return 'collapse';
  if (s.f.oversleep) return 'oversleep';
  if (s.f.final) return s.f.final === 1 ? (s.f.paper ? 'scholar' : 'qingbei') : ['', '', 'huawu', 'mid985', 'local'][s.f.final];
  const tr = s.f.track || 'kaoyan', res = s.f.res || 'fail';
  if (res === 'fail') {
    if (s.f.agency) return 'leek';
    if (s.a.mood >= 85) return 'happy';
    return { kaoyan: 'kaoyan_fail', abroad: 'abroad_fail', job: 'job_fail' }[tr];
  }
  if (tr === 'kaoyan') return res === 'top' ? 'kaoyan_top' : 'kaoyan_ok';
  if (tr === 'abroad') return res === 'top' ? 'abroad_top' : 'abroad_mid';
  return res === 'big' ? 'job_big' : 'job_ok';
}

/* ============ 存档 ============ */
let S = load();
let screen = S ? 'game' : 'title';
let tab = 'act';
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { if (S) localStorage.setItem(KEY, JSON.stringify(S)); else localStorage.removeItem(KEY); }
function unlocked() { try { return JSON.parse(localStorage.getItem(GKEY)) || []; } catch (e) { return []; } }
function unlock(id) { const u = unlocked(); if (!u.includes(id)) { u.push(id); localStorage.setItem(GKEY, JSON.stringify(u)); } }

function newGame(roleId) {
  let role = ROLES.find(r => r.id === roleId);
  if (!role.a) role = { n: role.n, coins: 1000 + Math.floor(Math.random() * 3000), bonus: 0, a: {
    gpa: Math.round((3.2 + Math.random() * .55) * 100) / 100, kn: 20 + Math.floor(Math.random() * 30),
    eng: 30 + Math.floor(Math.random() * 40), sci: Math.floor(Math.random() * 30), comp: Math.floor(Math.random() * 30),
    intern: Math.floor(Math.random() * 10), mood: 50 + Math.floor(Math.random() * 45) } };
  const name = ($('nameInput') && $('nameInput').value.trim()) || '小保';
  S = { v: 2, name, role: role.n, a: { ...role.a }, coins: role.coins, bonus: role.bonus, zhenti: 0,
        aff: Object.fromEntries(NPCS.map(n => [n.id, n.aff])), gifted: {},
        f: {}, offers: [], m: 0, ap: 0, apPenalty: 0, queue: [], cur: null, phase: 'month',
        result: null, feed: [], seenRand: [], log: [], rankHist: [], ending: null, turns: 0 };
  screen = 'game'; tab = 'act';
  startMonth();
  addLog(`${name}（${role.n}）的大三开始了。`);
  save(); render();
}

/* ============ 流程 ============ */
function addLog(t) { S.log.unshift({ st: S.m < MONTHS.length ? MONTHS[S.m].n : '终章', t }); S.log = S.log.slice(0, 120); }

function startMonth() {
  const mo = MONTHS[S.m];
  S.ap = Math.max(0, mo.ap - S.apPenalty);
  S.penaltyShown = S.apPenalty; S.apPenalty = 0;
  if (S.m > 0) S.coins += ALLOWANCE;
  const r = rank(S);
  S.rankPrev = S.rankHist.length ? S.rankHist[S.rankHist.length - 1] : r;
  S.rankHist.push(r);
  S.feed = [];
  // 本月事件队列：主线 → 社交触发 → 随机
  const q = [...mo.ev];
  SENIORS.forEach(id => { if (S.aff[id] >= 30 && !S.gifted[id]) { S.gifted[id] = 1; q.push('gift_' + id); } });
  ['wang', 'li', 'zhang'].forEach(id => { if (S.aff[id] >= 40 && !S.gifted[id]) { S.gifted[id] = 1; q.push('bond_' + id); } });
  if (S.m < 12 && S.m > 0 && roll(.4)) {
    const pool = Object.keys(RANDOM).filter(id => !S.seenRand.includes(id) && (!RANDOM[id].cond || RANDOM[id].cond(S)));
    if (pool.length) { const id = pick(pool); S.seenRand.push(id); q.push(id); }
  }
  S.queue = q;
  S.phase = 'month';
}

function proceed() {
  if (S.f.collapse) return finish();
  if (S.f.track && !S.f.trackDone) {
    S.queue = []; S.cur = 'tr_' + S.f.track; S.phase = 'event'; save(); render(); return;
  }
  if (S.f.trackDone) return finish();
  while (S.queue.length) {
    const id = S.queue.shift();
    if (EV[id].cond && !EV[id].cond(S)) continue;
    S.cur = id; S.phase = 'event'; save(); render(); return;
  }
  S.cur = null;
  if (S.ap > 0) { S.phase = 'plan'; save(); render(); return; }
  endMonth();
}

function endMonth() {
  S.m++;
  if (S.m >= MONTHS.length) return finish();
  startMonth(); save(); render();
}

function choose(i) {
  const ev = EV[S.cur], ch = val(ev.choices, S)[i];
  if (!ch || (ch.req && !ch.req(S))) return;
  const before = snap(S);
  if (ch.d) A(S, ch.d);
  let text = ch.r || '';
  if (ch.fx) { const t = ch.fx(S); if (t) text = t; }
  if (S.a.mood <= 0) { S.f.collapse = 1; text += '\n\n……你的心态彻底崩了。'; }
  const ds = diffs(before, S);
  S.result = { title: ev.title, choice: ch.t, text, deltas: ds };
  S.turns++;
  addLog(`【${ev.title}】${ch.t}${ds.length ? ' → ' + dtxt(ds) : ''}`);
  S.phase = 'result';
  save(); render();
  if (ds.some(d => d.t.startsWith('心态') && !d.up && parseInt(d.t.slice(3)) <= -10)) shake();
}

function doAction(id) {
  const a = ACTIONS.find(x => x.id === id);
  if (S.ap < a.ap || (a.cond && !a.cond(S))) return;
  const before = snap(S);
  S.ap -= a.ap;
  const t = a.run(S);
  afterPlan(`【${a.n}】${t}`, before);
}

function social(id, kind) {
  const n = npc(id), cost = kind === 'treat' ? 80 : 0;
  if (S.ap < 1 || S.coins < cost) return;
  const before = snap(S);
  S.ap--; S.coins -= cost;
  const g = kind === 'treat' ? 15 : 7 + Math.floor(Math.random() * 4);
  aff(S, id, g); A(S, { mood: kind === 'treat' ? 4 : 2 });
  if (SENIOR_ATTR[id]) grow(S, SENIOR_ATTR[id], 2);
  afterPlan(`【${kind === 'treat' ? '请吃饭' : '聊天'}·${n.n}】${kind === 'treat' ? '你们在校门口吃了顿烤肉。' : pick(CHAT[id])}（好感+${g}）`, before);
}

function buyAgency(lv) {
  const pkg = AGENCY.find(p => p.lv === lv);
  const price = pkg.price - (lv === 2 && S.f.agency === 1 ? AGENCY[0].price : 0);
  if ((S.f.agency || 0) >= lv || S.coins < price) return;
  if (!confirm(`确定花费 ¥${price} 购买【${pkg.n}】吗？`)) return;
  const before = snap(S);
  S.coins -= price;
  S.f.cv = 1; S.f.intel = 1;
  if (lv === 2) S.zhenti += 2;
  S.f.agency = lv;
  afterPlan(`【保研机构】购买了${pkg.n}。顾问："同学，保研是信息战！"`, before);
}

function afterPlan(text, before) {
  const ds = diffs(before, S);
  S.feed.unshift({ t: text, d: ds });
  addLog(text + (ds.length ? ' → ' + dtxt(ds) : ''));
  S.turns++;
  if (S.a.mood <= 0) { S.f.collapse = 1; return finish(); }
  save(); render();
}

function finishMonthClick() {
  if (S.ap > 0 && !confirm(`还有 ${S.ap} 个行动点没用，确定结束本月吗？`)) return;
  endMonth();
}

function next() {
  if (S.f.collapse) return finish();
  proceed();
}

function finish() {
  S.ending = calcEnding(S);
  S.phase = 'ending'; S.cur = null;
  unlock(S.ending);
  addLog(`达成结局：${ENDINGS[S.ending].t}`);
  save(); render();
}

/* ============ 渲染 ============ */
function render() { renderSide(); renderMain(); renderLog(); }
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function deltaTags(ds) { return ds.map(d => `<span class="delta ${d.up ? 'up' : 'down'}">${d.t}</span>`).join(''); }
function bar(v, min, max, c, n = 10) {
  const k = Math.round((v - min) / (max - min) * n);
  return `<div class="bar">${Array.from({ length: n }, (_, i) => `<i class="seg" style="${i < k ? 'background:' + c : ''}"></i>`).join('')}</div>`;
}

function renderSide() {
  const el = $('side');
  if (!S || screen !== 'game') {

    drawAvatar(70); return;
  }
  const r = rank(S), dr = S.rankPrev - r;
  let html = `<div class="avatar-box"><canvas id="avatar" width="96" height="96"></canvas>
    <div class="who"><b>${esc(S.name)}</b><div>${S.role}</div>

      <div><span class="big">第 ${r}</span> / ${N}
        <span class="${dr > 0 ? 'up' : dr < 0 ? 'down' : ''}">${dr > 0 ? '▲' + dr : dr < 0 ? '▼' + (-dr) : '—'}</span>
        <span style="font-size:12px">较上月</span></div>
      <div class="row" style="font-size:12px"><span>推免线：第 ${QUOTA} 名</span><span>加分 ${S.bonus.toFixed(1)}</span></div>
      <canvas id="rankChart" width="250" height="48"></canvas>
    </div>`;
  for (const k in ATTRS) {
    const m = ATTRS[k], v = S.a[k];
    html += `<div class="stat"><div class="row"><span>${m.n}</span><span>${k === 'gpa' ? v.toFixed(2) : v}</span></div>${bar(v, m.min, m.max, m.c)}</div>`;
  }

  if (S.a.mood < 25) html += `<div class="warn">⚠ 心态濒临崩溃！</div>`;
  const tags = [];
  if (S.f.paper) tags.push('<span class="tag g">一作论文</span>');
  if (S.f.coauthor) tags.push('<span class="tag g">挂名论文</span>');
  if (S.f.award) tags.push('<span class="tag g">竞赛大奖</span>');
  if (S.f.dachuang) tags.push('<span class="tag g">国创项目</span>');
  if (S.f.cet6) tags.push('<span class="tag g">六级高分</span>');
  if (S.f.cv) tags.push('<span class="tag">精修简历</span>');
  if (S.f.intel) tags.push('<span class="tag">情报</span>');
  if (S.f.agency) tags.push(`<span class="tag r">${S.f.agency === 2 ? '机构VIP' : '机构精修班'}</span>`);
  if (S.f.exaggerate) tags.push('<span class="tag r">简历注水</span>');
  if (S.f.buddy) tags.push('<span class="tag">学习搭子</span>');
  S.offers.slice().sort().forEach(t => tags.push(`<span class="tag y">offer·${TIER[t]}</span>`));
  if (tags.length) html += `<div class="tags">${tags.join('')}</div>`;
  el.innerHTML = html;
  drawAvatar(S.a.mood);
  drawRankChart();
}

  if (S.phase === 'event') {
    const ev = EV[S.cur], chs = val(ev.choices, S);
    el.innerHTML = `${header()}${ev.tag ? `<span class="stage-label" style="background:${ev.tag === '社交' ? 'var(--purple)' : 'var(--red)'};color:#fff">${ev.tag}事件</span>` : ''}
      <h2>${ev.title}</h2><div class="story" id="story"></div>
      <div id="choiceBox" class="choices" hidden>${chs.map((c, i) => {
        const lock = c.req && !c.req(S);
        return `<button class="btn px ${lock ? 'locked' : ''}" onclick="choose(${i})"><span class="key">${i + 1}</span>${c.t}
          ${lock ? `<span class="hint">🔒${c.rq || ''}</span>` : c.h ? `<span class="hint">${c.h}</span>` : ''}</button>`;
      }).join('')}</div>`;
    typeText(val(ev.text, S));
    return;
  }
  if (S.phase === 'result') {
    const r = S.result;
    el.innerHTML = `${header()}<h2>${r.title}</h2><div class="chosen">你选择了：${r.choice}</div>
      <div class="story" id="story"></div>
      <div id="choiceBox" class="choices" hidden>
        <div class="deltas">${deltaTags(r.deltas)}</div>
        <button class="btn center px" onclick="next()">▶ 继续</button></div>`;
    typeText(r.text || '……');
    return;
  }
  if (S.phase === 'plan') return renderPlan(el);
  if (S.phase === 'ending') {
    const e = ENDINGS[S.ending], u = unlocked();
    el.innerHTML = `<div class="ending">
      <span class="stage-label">THE END</span><br>
      <span class="rarity px" style="background:${e.c}">${e.r}</span>
      <h2>${e.t}</h2>
      <div class="desc px">${esc(e.d(S))}</div>
      <div class="summary">
        <div>GPA ${S.a.gpa.toFixed(2)}</div><div>排名 ${rank(S)}/${N}</div><div>基础 ${S.a.kn}</div><div>英语 ${S.a.eng}</div>
        <div>科研 ${S.a.sci}</div><div>竞赛 ${S.a.comp}</div><div>实习 ${S.a.intern}</div><div>心态 ${S.a.mood}</div>
        <div>金币 ¥${S.coins}</div><div>加分 ${S.bonus.toFixed(1)}</div><div>决策 ${S.turns} 次</div><div>Offer ${S.offers.length} 个</div>
      </div>
      <p>已解锁结局：${u.length} / ${Object.keys(ENDINGS).length}</p>
      <button class="btn center px" onclick="screen='pick';render()">★ 再来一局</button>
      <button class="btn center px" onclick="showGallery()">◆ 结局图鉴</button></div>`;
  }
}

function renderPlan(el) {
  const mo = MONTHS[S.m], r = rank(S), dr = S.rankPrev - r;
  let body = '';
  if (tab === 'act') {
    body = `<div class="grid">${ACTIONS.map(a => {
      const ok = S.ap >= a.ap && (!a.cond || a.cond(S));
      return `<button class="act px" ${ok ? '' : 'disabled'} onclick="doAction('${a.id}')"><span class="cost">${a.ap}行动点</span>
        <b>${a.n}</b><p>${a.cond && !a.cond(S) ? '🔒' + a.lock : a.d}</p></button>`;
    }).join('')}</div>`;
  } else if (tab === 'social') {
    body = `<div class="grid">${NPCS.map(n => {
      const v = S.aff[n.id];
      return `<div class="npc px"><div class="npc-top"><div class="npc-face px" style="background:${n.color}">${n.n[0]}</div>
        <div><b>${n.n}</b> <span class="tag">${n.type}</span><div class="row"><span>好感</span><span>${v}</span></div></div></div>
        ${bar(v, 0, 100, n.color)}<p>${n.d}</p>
        ${n.perks.map(([th, t]) => `<div class="perk ${v >= th ? 'done' : ''}">${t}</div>`).join('')}
        <div class="npc-btns"><button ${S.ap >= 1 ? '' : 'disabled'} onclick="social('${n.id}','chat')">聊天(1点)</button>
        <button ${S.ap >= 1 && S.coins >= 80 ? '' : 'disabled'} onclick="social('${n.id}','treat')">请吃饭(1点 ¥80)</button></div></div>`;
    }).join('')}</div>`;
  } else {
    body = `<p style="margin-top:0">"同学，保研是信息战！我们机构往届学员 98% 上岸！"——机构顾问<br><span style="font-size:13px">（不占行动点，但价格不菲）</span></p>` +
      AGENCY.map(p => {
        const owned = (S.f.agency || 0) >= p.lv;
        const price = p.price - (p.lv === 2 && S.f.agency === 1 ? AGENCY[0].price : 0);
        return `<div class="agency px"><b>${p.n}</b> <span class="price">¥${price}</span>${p.lv === 2 && S.f.agency === 1 ? '（已抵扣精修班费用）' : ''}
          <div style="white-space:pre-wrap;font-size:14px">${p.perks}</div>
          <button class="btn center px" ${owned || S.coins < price || S.m > 12 ? 'disabled' : ''} onclick="buyAgency(${p.lv})">${owned ? '已购买' : S.coins < price ? '金币不足' : '购买'}</button></div>`;
      }).join('');
  }
  el.innerHTML = `${header()}<h2>${mo.n} · 月度计划</h2>
    <div class="plan-head"><span class="ap">行动点 ${Array.from({ length: Math.max(mo.ap, S.ap) }, (_, i) => `<i class="${i < S.ap ? '' : 'off'}"></i>`).join('')}</span>
      <span>金币 <b>¥${S.coins}</b></span>
      <span>排名 <b>第 ${r} 名</b> <span class="${dr > 0 ? 'up' : dr < 0 ? 'down' : ''}">${dr > 0 ? '▲' + dr : dr < 0 ? '▼' + (-dr) : ''}</span></span>
      <span>真题 <b>×${S.zhenti}</b></span></div>
    <div class="tabs">
      <button class="tab px ${tab === 'act' ? 'on' : ''}" onclick="tab='act';render()">行动</button>
      <button class="tab px ${tab === 'social' ? 'on' : ''}" onclick="tab='social';render()">社交</button>
      <button class="tab px ${tab === 'agency' ? 'on' : ''}" onclick="tab='agency';render()">保研机构</button>
    </div>
    ${body}
    ${S.feed.length ? `<div class="feed">${S.feed.map(f => `<div>${esc(f.t)}<div class="deltas">${deltaTags(f.d)}</div></div>`).join('')}</div>` : ''}
    <button class="btn center px" onclick="finishMonthClick()">${S.ap > 0 ? '结束本月 ▶' : '行动点用完了，进入下个月 ▶'}</button>`;
}

function renderLog() {
  const el = $('logbox');
  if (!S || screen !== 'game') { el.innerHTML = '<h3>▼ 人生日志</h3><div class="log-item">暂无记录</div>'; return; }
  el.innerHTML = '<h3>▼ 人生日志</h3>' + S.log.map(l => `<div class="log-item"><span>[${l.st}]</span> ${esc(l.t)}</div>`).join('');
}

/* 打字机效果：点击文字可跳过 */
let typer = null;
function typeText(text) {
  clearInterval(typer);
  const el = $('story'), box = $('choiceBox');
  let i = 0;
  el.classList.add('cursor');
  const done = () => { clearInterval(typer); typer = null; el.textContent = text; el.classList.remove('cursor'); box.hidden = false; };
  el.onclick = done;
  typer = setInterval(() => { i += 2; el.textContent = text.slice(0, i); if (i >= text.length) done(); }, 25);
}

function shake() { const m = $('main'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); }

/* 像素小人：表情随心态变化 */
function drawAvatar(mood) {
  const cv = $('avatar'); if (!cv) return;
  const ctx = cv.getContext('2d'), P = 8;
  const face = mood >= 60
    ? ['..ssmssmss..', '...ssmmss...']
    : mood >= 30 ? ['..ssssssss..', '...ssmmss...'] : ['..sssmmsss..', '...smssms...'];
  const map = [
    '....hhhh....', '..hhhhhhhh..', '.hhhhhhhhhh.', '.hssssssssh.',
    '..swwsswws..', '..sesssses..', face[0], face[1],
    '....bbbb....', '..bbbyybbb..', '.sbbbyybbbs.', '.sbbbbbbbbs.',
  ];
  const col = { h: '#3a2c2c', s: '#f5c9a0', e: '#22223b', w: '#ffffff', m: '#c0392b', b: '#4d96ff', y: '#f9c74f' };
  ctx.clearRect(0, 0, 96, 96);
  map.forEach((row, y) => [...row].forEach((ch, x) => { if (col[ch]) { ctx.fillStyle = col[ch]; ctx.fillRect(x * P, y * P, P, P); } }));
  if (mood < 30) { ctx.fillStyle = '#8ecae6'; ctx.fillRect(10 * P, 3 * P, P, P); ctx.fillRect(10 * P, 4 * P, P, P); }
}

/* 排名走势：柱子越高排名越靠前，虚线为推免线 */
function drawRankChart() {
  const cv = $('rankChart'); if (!cv) return;
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const hist = [...S.rankHist.slice(0, -1), rank(S)];
  const bw = Math.floor(W / MONTHS.length);
  const yOf = r => Math.round((r - 1) / (N - 1) * (H - 4));
  hist.forEach((r, i) => {
    ctx.fillStyle = r <= QUOTA ? '#43aa8b' : '#e94560';
    const y = yOf(r);
    ctx.fillRect(i * bw + 1, y, bw - 3, H - y);
  });
  ctx.fillStyle = '#f9c74f';
  const ly = yOf(QUOTA);
  for (let x = 0; x < W; x += 8) ctx.fillRect(x, ly, 4, 2);
}

/* ============ 弹窗 / 菜单 ============ */
function modal(html) { $('modalBody').innerHTML = html; $('modal').hidden = false; }
function closeModal() { $('modal').hidden = true; }
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function showGallery() {
  const u = unlocked();
  modal(`<h2>结局图鉴（${u.length}/${Object.keys(ENDINGS).length}）</h2>
    <div class="gallery">${Object.entries(ENDINGS).map(([id, e]) => u.includes(id)
      ? `<div class="g-item px"><span class="tag" style="background:${e.c}">${e.r}</span> <b>${e.t}</b></div>`
      : `<div class="g-item px lock"><span class="tag">?</span> <b>？？？</b></div>`).join('')}</div>
    <button class="btn center px" onclick="closeModal()">关闭</button>`);
}

function showMenu() {
  modal(`<h2>菜单</h2>
    <button class="btn center px" onclick="closeModal();screen='title';render()">返回标题</button>
    <button class="btn center px" onclick="if(confirm('确定放弃当前进度，重新开始吗？')){closeModal();screen='pick';render()}">重新开始</button>
    <button class="btn center px" onclick="if(confirm('确定删除存档吗？结局图鉴会保留。')){S=null;save();closeModal();screen='title';render()}">删除存档</button>
    <button class="btn center px" onclick="closeModal()">关闭</button>
    <p style="font-size:13px">玩法：每月用行动点安排学习、科研、竞赛、兼职、实习和社交。<br>
    排名 = GPA + 加分，同学们也在进步，不进则退。推免线为第 ${QUOTA} 名。<br>
    学长学姐好感≥25 会在特定月份邀请你做项目，≥30 送保研真题。<br>
    快捷键：数字键选择选项，空格 / 回车 继续。</p>`);
}
$('btnMenu').onclick = showMenu;
$('btnGallery').onclick = showGallery;

document.addEventListener('keydown', e => {
  if (!$('modal').hidden || screen !== 'game' || !S || e.target.tagName === 'INPUT') return;
  const box = $('choiceBox');
  if (typer && (e.key === ' ' || e.key === 'Enter')) { $('story').onclick(); e.preventDefault(); return; }
  if (!box || box.hidden) return;
  if (S.phase === 'event' && /^[1-9]$/.test(e.key)) choose(+e.key - 1);
  else if ((e.key === ' ' || e.key === 'Enter') && (S.phase === 'result' || S.phase === 'month')) {
    e.preventDefault(); S.phase === 'result' ? next() : proceed();
  }
});

render();
</script>
</body>
