<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>保研模拟器</title>
<style>
*{box-sizing:border-box}
:root{
  --ink:#1f1d36;--ink2:#3f3a64;--paper:#f6ecd2;--paper2:#ead9b1;--paper3:#dcc690;--bg:#17152b;
  --red:#e94560;--green:#43aa8b;--yellow:#f9c74f;--blue:#4d96ff;--purple:#9b5de5;--orange:#f8961e;--teal:#2ec4b6;--pink:#ff70a6;
  --hl:rgba(255,255,255,.45);--sh:rgba(0,0,0,.18);
  --font:"Microsoft YaHei","PingFang SC","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --pxfont:Consolas,"Courier New",monospace;
}
html,body{margin:0;min-height:100vh}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.75;
  background-image:
    radial-gradient(circle at 20% 10%,rgba(155,93,229,.18),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(233,69,96,.14),transparent 40%),
    linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);
  background-size:auto,auto,24px 24px,24px 24px;
}
body::after{content:"";pointer-events:none;position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 2px,transparent 2px 4px);z-index:99}
button,input{font:inherit;color:inherit}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}

/* 像素描边：缺角 + 内高光 + 外投影 */
.px{position:relative;box-shadow:
  0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),
  4px 8px 0 0 rgba(0,0,0,.35),8px 4px 0 0 rgba(0,0,0,.35),
  inset -4px -4px 0 0 var(--sh),inset 4px 4px 0 0 var(--hl)}
.panel{background:var(--paper);padding:18px 20px}

#app{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--red);color:#fff;padding:10px 16px;margin-bottom:26px;flex-wrap:wrap}
.logo{font-family:var(--pxfont);font-size:14px;font-weight:bold;letter-spacing:1px;text-shadow:2px 2px 0 var(--ink)}
.logo span{font-family:var(--font);font-size:19px;margin-left:8px}
.top-btns{display:flex;gap:14px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}

.btn{display:block;width:100%;text-align:left;border:0;cursor:pointer;padding:10px 14px;margin:14px 0;background:var(--yellow);color:var(--ink);transition:transform .05s}
.btn:hover{transform:translate(-2px,-2px);background:#ffd96b}
.btn:active{transform:translate(2px,2px);box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 4px 4px 0 0 var(--sh)}
.btn.small{display:inline-block;width:auto;margin:0;padding:3px 12px;font-size:14px;background:var(--paper)}
.btn.center{text-align:center}
.btn.alt{background:var(--paper2)}
.btn.locked,.btn:disabled{background:#b9b2a0;color:#6b6457;cursor:not-allowed;transform:none}
.btn .hint{float:right;font-size:13px;opacity:.8;margin-left:8px}
.btn .key{display:inline-block;background:var(--ink);color:var(--yellow);padding:0 6px;margin-right:10px;font-family:var(--pxfont);font-size:13px;font-weight:bold;line-height:20px}

/* 侧栏 */
.avatar-box{display:flex;gap:14px;align-items:center;margin-bottom:12px}
#avatar{background:linear-gradient(var(--paper3),var(--paper2));width:96px;height:96px;flex:none}
.who b{font-size:19px}
.who div{font-size:13px}
.badge{display:inline-block;background:var(--ink);color:var(--yellow);font-size:12px;padding:0 6px;margin-top:2px}
.badge.post{background:var(--red);color:#fff}
.stat{margin:4px 0}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{display:flex;gap:2px;margin-top:2px}
.seg{flex:1;height:9px;background:rgba(0,0,0,.12)}
.divider{height:4px;background:var(--ink);margin:12px 0;opacity:.85}
.sec-title{font-size:13px;background:var(--ink);color:var(--paper);display:inline-block;padding:0 8px;margin:4px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;padding:0 6px;background:var(--ink);color:var(--paper)}
.tag.g{background:var(--green);color:#fff}.tag.r{background:var(--red);color:#fff}.tag.y{background:var(--yellow);color:var(--ink)}.tag.b{background:var(--blue);color:#fff}
.warn{color:var(--red);font-size:13px;animation:blink 1s steps(2) infinite}
.rankbox{background:var(--ink);color:var(--paper);padding:8px 10px;margin:8px 0}
.rankbox .big{font-size:24px;color:var(--yellow)}
.up{color:var(--green)}.down{color:var(--red)}
.rankbox .up{color:#7ee2b8}.rankbox .down{color:#ff8fa3}
#rankChart{width:100%;height:48px;background:rgba(255,255,255,.06);margin-top:4px}
.money{font-size:18px;color:var(--ink)}
.gate{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:12px}
.gate span.ok{color:var(--green)}.gate span.no{color:var(--red)}
.dim{display:grid;grid-template-columns:62px 1fr 28px;align-items:center;gap:6px;font-size:13px;margin:2px 0}
.dim .track{position:relative;height:10px;background:rgba(0,0,0,.12)}
.dim .fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.dim .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red)}
.dim.weak .fill{background:var(--red);animation:blink 1s steps(2) infinite}

/* 主面板 */
.stage-label{display:inline-block;background:var(--ink);color:var(--yellow);padding:0 8px;font-size:13px}
.ev-tag{display:inline-block;color:#fff;padding:0 8px;font-size:13px;margin-left:8px}
.progress{display:flex;gap:3px;margin:8px 0 14px}
.progress i{flex:1;height:8px;background:rgba(0,0,0,.14)}
.progress i.on{background:var(--red)}
.progress i.now{background:var(--yellow);animation:blink 1s steps(2) infinite}
h2{margin:6px 0 10px;font-size:23px}
.scene{display:block;width:100%;height:auto;aspect-ratio:4/1;margin:4px 0 12px;background:var(--ink)}
.story{white-space:pre-wrap;min-height:80px;cursor:pointer;background:rgba(255,255,255,.35);padding:10px 12px;border-left:4px solid var(--ink)}
.cursor::after{content:"▌";animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.choices{animation:fadein .25s steps(4)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.delta{padding:1px 8px;font-size:14px;color:#fff}
.delta.up{background:var(--green)}.delta.down{background:var(--red)}
.chosen{font-size:14px;opacity:.75;margin-bottom:6px}
.shake{animation:shake .3s steps(3)}
@keyframes shake{25%{transform:translate(-6px,0)}50%{transform:translate(6px,0)}75%{transform:translate(-3px,0)}}

/* 月度计划 */
.plan-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--ink);color:var(--paper);padding:8px 12px;margin-bottom:16px}
.plan-head b{color:var(--yellow)}
.ap i{display:inline-block;width:14px;height:14px;margin-right:3px;background:var(--yellow);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.ap i.off{background:#555}
.tabs{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:0;cursor:pointer;padding:4px 16px;background:var(--paper2)}
.tab.on{background:var(--red);color:#fff}
.cat{font-size:13px;margin:14px 0 8px;color:var(--ink2)}
.cat::before{content:"■ ";color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.act{border:0;cursor:pointer;text-align:left;background:var(--paper2);padding:8px 10px}
.act:hover:not(:disabled){background:var(--yellow);transform:translate(-2px,-2px)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act b{font-size:15px}
.act .cost{float:right;font-size:12px;background:var(--ink);color:var(--yellow);padding:0 5px}
.act p{margin:2px 0 0;font-size:12px}
.feed{margin-top:16px;font-size:13px;background:rgba(0,0,0,.06);padding:8px 10px;max-height:170px;overflow:auto}
.feed>div{border-bottom:2px dashed rgba(0,0,0,.1);padding:2px 0}
.feed .deltas{margin:2px 0}
.feed .delta{font-size:12px}

.npc{background:var(--paper2);padding:10px}
.npc-top{display:flex;gap:10px;align-items:center}
.npc-face{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex:none}
.npc p{margin:4px 0;font-size:12px}
.npc .perk{font-size:12px;padding:0 4px;background:rgba(0,0,0,.08);margin:2px 0}
.npc .perk.done{background:var(--green);color:#fff}
.npc-btns{display:flex;gap:10px;margin-top:8px}
.npc-btns button{flex:1;border:0;cursor:pointer;background:var(--yellow);padding:2px 4px;font-size:13px}
.npc-btns button:disabled{background:#bbb;cursor:not-allowed}
.agency{background:var(--paper2);padding:12px;margin-bottom:16px}
.agency .price{color:var(--red);font-size:20px}

/* 标题页 */
.title-screen{text-align:center;padding:20px 10px}
#titleArt{width:100%;max-width:560px;height:auto;aspect-ratio:7/2}
.big-title{font-size:52px;font-weight:900;color:var(--red);letter-spacing:6px;margin:6px 0;text-shadow:3px 3px 0 var(--ink)}
.sub-title{letter-spacing:3px}
.en{font-family:var(--pxfont);font-size:13px;font-weight:bold;letter-spacing:3px}
.press{margin-top:20px;animation:blink 1.2s steps(2) infinite;font-family:var(--pxfont);font-size:13px;font-weight:bold;letter-spacing:2px}
.menu{max-width:320px;margin:20px auto 0}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:14px}
.role{cursor:pointer;background:var(--paper2);padding:12px;border:0;text-align:left}
.role:hover{background:#fff3c4;transform:translate(-2px,-2px)}
.role b{font-size:18px}
.role p{margin:4px 0 0;font-size:13px}
.role .pro{color:#257a5f}.role .con{color:#b3253f}
.role .nums{font-size:12px;opacity:.75}
.name-input{background:#fff;border:0;padding:6px 10px;width:180px;margin-left:8px}

/* 日志 */
#logbox{margin-top:26px;max-height:220px;overflow:auto;font-size:13px}
#logbox h3{margin:0 0 6px;font-size:15px}
.log-item{border-bottom:2px dashed rgba(0,0,0,.15);padding:3px 0}
.log-item span{color:var(--red)}

/* 结局 */
.ending{text-align:center}
.rarity{display:inline-block;padding:2px 16px;color:#fff;margin:8px 0;font-family:var(--pxfont);font-size:18px;font-weight:bold;line-height:28px}
.rarity.SSR{animation:glow 1.2s steps(3) infinite}
@keyframes glow{0%{filter:brightness(1)}50%{filter:brightness(1.4)}100%{filter:brightness(1)}}
.ending h2{font-size:32px;margin:10px 0;text-shadow:2px 2px 0 var(--yellow)}
.ending .desc{text-align:left;white-space:pre-wrap;background:var(--paper2);padding:12px;margin:16px 0}
.shot-wrap{background:var(--ink);padding:10px;margin:16px 0}
#offerShot{width:100%;height:auto;image-rendering:auto;display:block}
.shot-cap{color:var(--paper);font-size:12px;margin-top:6px}
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0;font-size:14px}
.summary div{background:var(--ink);color:var(--paper);padding:4px}

/* 弹窗 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
#modal .panel{max-width:720px;width:100%;max-height:86vh;overflow:auto}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin:14px 0}
.g-item{background:var(--paper2);padding:8px;font-size:13px}
.g-item b{font-size:14px}
.g-item.lock{opacity:.5}
.help p{font-size:14px;margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <header class="topbar px">
    <div class="logo">BAOYAN SIM<span>保研模拟器</span></div>
    <div class="top-btns">
      <button class="btn small px" id="btnGallery">结局图鉴</button>
      <button class="btn small px" id="btnMenu">菜单</button>
    </div>
  </header>
  <div class="layout">
    <aside id="side" class="panel px"></aside>
    <main id="main" class="panel px"></main>
  </div>
  <section id="logbox" class="panel px"></section>
</div>
<div id="modal" hidden><div class="panel px" id="modalBody"></div></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/events.js"></script>
<script src="js/random.js"></script>
<script src="js/pixel.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
